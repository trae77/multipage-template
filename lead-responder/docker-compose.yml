# Free local demo: n8n (community image) + a mock sender that only logs. No paid accounts.
# docker compose -f lead-responder/docker-compose.yml up -d   ->  n8n at http://localhost:5678
services:
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false   # lets the Config node read the placeholders below
      - N8N_SECURE_COOKIE=false              # local http only
      - GENERIC_TIMEZONE=America/Denver
      - BUSINESS_NAME=Sample Plumbing Co.
      - MOCK_SEND_URL=http://mock-sender:8787
      - OWNER_ALERT_TO={{OWNER_ALERT_TO}}
      - MISSED_CALL_SMS=off
      # Leave as placeholders to use the built-in template reply. Fill all three for an LLM reply.
      - LLM_API_KEY={{LLM_API_KEY}}
      - LLM_BASE_URL={{LLM_BASE_URL}}        # any OpenAI-compatible base URL, e.g. https://host/v1
      - LLM_MODEL={{LLM_MODEL}}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on: [mock-sender]
  mock-sender:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "mock-sender.mjs"]
    environment: [PORT=8787, LOG_FILE=/data/mock-sent.jsonl]
    ports: ["8787:8787"]
    volumes:
      - ./mock:/app:ro
      - mock_data:/data
volumes:
  n8n_data:
  mock_data:
